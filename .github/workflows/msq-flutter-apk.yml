name: Build Mini Safeerul Quran Flutter APK

on:
  pull_request:
    paths:
      - 'flutter_src/**'
      - '.github/workflows/msq-flutter-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Restore source archive
        shell: bash
        run: |
          cat \
            flutter_src/part_00.b64 flutter_src/suffix_00.b64 \
            flutter_src/part_01.b64 \
            flutter_src/part_02.b64 \
            flutter_src/part_03.b64 \
            flutter_src/part_04.b64 flutter_src/suffix_04.b64 \
            flutter_src/part_05.b64 flutter_src/suffix_05.b64 \
            > source.b64
          python3 - <<'PY'
          from pathlib import Path
          p = Path('source.b64')
          s = p.read_text()
          s = s[:63080] + s[63128:]
          s = s[:61299] + '0fbCdPng2fbBMH/uczj5Csw+37GMn+0TIPquxT1HsAw776AE' + s[61299:]
          s = s[:59889] + s[60000:]
          s = s[:57451] + s[57452:]
          s = s[:56139] + 'blpB50r+Txb/3xb+p+DeWlHnSv5PFv/fFv6n4d1lSZkiy9/e+9zf1/q5LyDzp38ni3/vi31T82xUfoJP+nSz+vS/+TcW/+5LyOOnfyd7f+97f1Pt' + s[56139:]
          s = s[:54682] + 'm' + s[54683:]
          s = s[:11998] + s[11999:]
          s = s[:1930] + 'R' + s[1930:]
          assert len(s) == 63128
          p.write_text(s)
          PY
          echo 'dcebeddadad8edff87911234bc2dfe7d421f71f5a14ca8260c21e1fdccc59694  source.b64' | sha256sum -c -
          base64 --decode source.b64 > source.zip
          echo 'da4425e09675b6025af8a9d81161002d50ff2115cdb9b6aa8c4961a05e9a394f  source.zip' | sha256sum -c -
          unzip -t source.zip | tail -2
          unzip -q source.zip
          test -f msq_flutter_build_src/pubspec.yaml
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create mobile platforms and get packages
        working-directory: msq_flutter_build_src
        run: |
          flutter create --platforms=android,ios --org org.safeerulquran --project-name mini_safeerul_quran .
          rm -f test/widget_test.dart
          flutter pub get
          dart run flutter_launcher_icons
          sed -i 's/android:label="mini_safeerul_quran"/android:label="Mini Safeerul Qur’an"/' android/app/src/main/AndroidManifest.xml
      - name: Analyze and test
        working-directory: msq_flutter_build_src
        run: |
          flutter analyze
          flutter test
      - name: Build signed debug APK
        working-directory: msq_flutter_build_src
        run: flutter build apk --debug
      - name: Verify APK
        shell: bash
        run: |
          APK=msq_flutter_build_src/build/app/outputs/flutter-apk/app-debug.apk
          test -f "$APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          ZIPALIGN=$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -1)
          "$APKSIGNER" verify --verbose "$APK"
          "$ZIPALIGN" -c -P 16 -v 4 "$APK"
          unzip -t "$APK" | tail -2
          sha256sum "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: msq-flutter-debug-apk
          path: msq_flutter_build_src/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 1
          if-no-files-found: error
