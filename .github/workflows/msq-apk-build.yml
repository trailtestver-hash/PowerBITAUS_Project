name: Build Mini Safeerul Quran Installable APK

on:
  pull_request:
    paths:
      - 'msq_android/**'
      - '.github/workflows/msq-apk-build.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build standard debug-signed APK
        working-directory: msq_android
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK package and signatures
        shell: bash
        run: |
          APK="msq_android/app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)
          test -f "$APK"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          "$AAPT" dump badging "$APK" | head -20
          unzip -t "$APK" | tail -2
          sha256sum "$APK"

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: msq-installable-debug-apk
          path: msq_android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 1
