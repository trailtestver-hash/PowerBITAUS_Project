# /.github/workflows/build-daily-money-record.yml
name: Build Daily Money Record APK

on:
  pull_request:
    branches: [main]
    paths:
      - 'daily-money-record-clean/**'
      - '.github/workflows/build-daily-money-record.yml'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" >/dev/null

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Reconstruct and verify clean source
        run: |
          set -euo pipefail
          mkdir -p daily-money-record-clean-src
          cat daily-money-record-clean/source2.part00 \
              daily-money-record-clean/source2.part01 \
              daily-money-record-clean/source2.part02 \
              daily-money-record-clean/source2.part03 \
              daily-money-record-clean/source2.part04 \
              daily-money-record-clean/source2.part05 \
              daily-money-record-clean/source2.part06 \
              daily-money-record-clean/source2.part07 \
              | base64 -d > /tmp/DailyMoneyRecord_Clean_Source.zip
          echo "80d75485fc7e9a5569fa87bb4615bfd604557f7662ee08d12b2e7aa93b96b74c  /tmp/DailyMoneyRecord_Clean_Source.zip" | sha256sum -c -
          unzip -t /tmp/DailyMoneyRecord_Clean_Source.zip
          unzip -q /tmp/DailyMoneyRecord_Clean_Source.zip -d daily-money-record-clean-src

      - name: Apply fresh diagnostic package
        run: |
          set -euo pipefail
          FILE="daily-money-record-clean-src/app/build.gradle"
          sed -i "s/applicationId 'com.jewel.dailymoneyrecord'/applicationId 'com.jewel.dailymoneyrecord.test1'/" "$FILE"
          sed -i "s/versionCode 1/versionCode 101/" "$FILE"
          sed -i "s/versionName '1.0.0-clean-beta1'/versionName '1.0.0-diagnostic-test1'/" "$FILE"
          grep -F "applicationId 'com.jewel.dailymoneyrecord.test1'" "$FILE"
          grep -F "versionCode 101" "$FILE"
          grep -F "versionName '1.0.0-diagnostic-test1'" "$FILE"

      - name: Build debug APK with Android Gradle Plugin
        working-directory: daily-money-record-clean-src
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify package, signature, alignment and APK identity
        shell: bash
        run: |
          set -euo pipefail
          APK="daily-money-record-clean-src/app/build/outputs/apk/debug/app-debug.apk"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          ZIPALIGN="$ANDROID_HOME/build-tools/35.0.0/zipalign"
          test -s "$APK"
          "$AAPT" dump badging "$APK" | tee Daily_Money_Record_Diagnostic_Test1_Verification.txt
          grep -q "package: name='com.jewel.dailymoneyrecord.test1'" Daily_Money_Record_Diagnostic_Test1_Verification.txt
          grep -q "versionCode='101'" Daily_Money_Record_Diagnostic_Test1_Verification.txt
          grep -q "versionName='1.0.0-diagnostic-test1'" Daily_Money_Record_Diagnostic_Test1_Verification.txt
          grep -q "application-label:'Daily Money Record'" Daily_Money_Record_Diagnostic_Test1_Verification.txt
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee -a Daily_Money_Record_Diagnostic_Test1_Verification.txt
          "$ZIPALIGN" -c -v 4 "$APK" | tee -a Daily_Money_Record_Diagnostic_Test1_Verification.txt
          sha256sum "$APK" | tee -a Daily_Money_Record_Diagnostic_Test1_Verification.txt
          cp "$APK" Daily_Money_Record_Diagnostic_Test1.apk

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: Daily-Money-Record-Diagnostic-Test1
          path: |
            Daily_Money_Record_Diagnostic_Test1.apk
            Daily_Money_Record_Diagnostic_Test1_Verification.txt
          if-no-files-found: error
          retention-days: 14
